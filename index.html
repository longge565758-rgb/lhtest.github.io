<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>特码选号</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f7f9fc;
      color: #333;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 容器布局 */
    .app-container {
      display: flex;
      width: 100%;
      height: 100vh;
      padding-bottom: 60px; /* 留出底部提交栏空间 */
    }

    /* 左侧菜单 */
    .sidebar {
      width: 85px;
      background-color: #eef3f8;
      border-right: 1px solid #d0d7de;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .menu-item {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      color: #333;
      border-bottom: 1px solid #dbe2ea;
      background-color: #eef3f8;
      cursor: pointer;
    }

    .menu-item.active {
      background-color: #1a60c3;
      color: #ffffff;
      font-weight: bold;
    }

    /* 右侧主内容区 */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px;
      background-color: #ffffff;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    /* 数字球卡片样式 */
    .ball-card {
      border: 1px solid #a6a6a6;
      border-radius: 6px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .ball-card.selected {
      border: 2px solid #1a60c3;
      background-color: #e8f2ff;
      box-shadow: 0 0 4px rgba(26, 96, 195, 0.3);
    }

    /* 3D数字球样式 */
    .ball {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 4px;
      box-shadow: inset -2px -2px 4px rgba(0, 0, 0, 0.35), inset 1px 1px 3px rgba(255, 255, 255, 0.8);
    }

    .ball::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ffffff;
      border-radius: 50%;
      z-index: 1;
    }

    .ball-num {
      position: relative;
      z-index: 2;
      font-size: 13px;
      font-weight: bold;
      color: #000;
    }

    /* 波色颜色 */
    .ball.red {
      background: radial-gradient(circle at 35% 35%, #ff6b6b, #d92323);
    }

    .ball.blue {
      background: radial-gradient(circle at 35% 35%, #4dabf7, #0b6bcb);
    }

    .ball.green {
      background: radial-gradient(circle at 35% 35%, #51cf66, #2b8a3e);
    }

    /* 数值文本 */
    .ball-value {
      font-size: 14px;
      color: #d9363e;
      font-weight: 600;
    }

    /* 底部提交栏 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #ffffff;
      border-top: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
      z-index: 1000;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .input-group label {
      font-size: 13px;
      color: #555;
      white-space: nowrap;
    }

    .input-group input {
      width: 90px;
      height: 36px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0 8px;
      font-size: 15px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #1a60c3;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }

    .btn-submit {
      background-color: #1a60c3;
      color: #fff;
    }

    .btn-submit:active {
      background-color: #124997;
    }

    .btn-reset {
      background-color: #e0e0e0;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 左侧菜单栏 -->
    <div class="sidebar">
      <div class="menu-item">快捷</div>
      <div class="menu-item active">特码</div>
      <div class="menu-item">两面</div>
      <div class="menu-item">色波</div>
      <div class="menu-item">特肖</div>
      <div class="menu-item">合肖</div>
      <div class="menu-item">头尾数</div>
      <div class="menu-item">正码</div>
    </div>

    <!-- 右侧数字球区域 -->
    <div class="main-content">
      <div class="grid-container" id="ballGrid"></div>
    </div>
  </div>

  <!-- 底部操作栏 -->
  <div class="bottom-bar">
    <div class="input-group">
      <label for="subValue">减去数值:</label>
      <input type="number" id="subValue" step="0.01" placeholder="0.00">
    </div>
    <div class="btn-group">
      <button class="btn btn-reset" onclick="clearSelection()">取消选择</button>
      <button class="btn btn-submit" onclick="submitChanges()">提交</button>
    </div>
  </div>

  <script>
    // 红波、蓝波、绿波列表
    const RED_BALLS = [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46];
    const BLUE_BALLS = [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48];
    const GREEN_BALLS = [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49];

    // 初始化 01-49 数据
    const ballsData = Array.from({ length: 49 }, (_, i) => {
      const num = i + 1;
      let color = 'red';
      if (BLUE_BALLS.includes(num)) color = 'blue';
      if (GREEN_BALLS.includes(num)) color = 'green';

      return {
        id: num,
        numStr: num < 10 ? '0' + num : '' + num,
        color: color,
        value: 47.03,
        selected: false
      };
    });

    // 渲染页面
    function renderGrid() {
      const grid = document.getElementById('ballGrid');
      grid.innerHTML = '';

      ballsData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `ball-card ${item.selected ? 'selected' : ''}`;
        card.onclick = () => toggleSelect(index);

        card.innerHTML = `
          <div class="ball ${item.color}">
            <span class="ball-num">${item.numStr}</span>
          </div>
          <div class="ball-value">${item.value.toFixed(2)}</div>
        `;
        grid.appendChild(card);
      });
    }

    // 切换选中状态
    function toggleSelect(index) {
      ballsData[index].selected = !ballsData[index].selected;
      renderGrid();
    }

    // 清除选中
    function clearSelection() {
      ballsData.forEach(item => item.selected = false);
      renderGrid();
    }

    // 提交修改数值 (47.03 - 文本框数值)
    function submitChanges() {
      const input = document.getElementById('subValue');
      const inputVal = parseFloat(input.value);

      if (isNaN(inputVal)) {
        alert('请输入有效的数值');
        return;
      }

      const selectedItems = ballsData.filter(item => item.selected);
      if (selectedItems.length === 0) {
        alert('请先勾选需要修改的数字球');
        return;
      }

      // 选中的数字球数值更新为：47.03 - 输入值
      ballsData.forEach(item => {
        if (item.selected) {
          item.value = 47.03 - inputVal;
          item.selected = false; // 提交后取消选中
        }
      });

      input.value = '';
      renderGrid();
    }

    // 页面初始化加载
    renderGrid();
  </script>
</body>
</html>
